<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%PAGE_TITLE%%</title>
<style>
:root{
  --bg:#fbfaf6;
  --paper:#fffefa;
  --text:#1f211e;
  --muted:#76786f;
  --line:#d7d9d1;
  --accent:#176b68;
  --accent-soft:rgba(23,107,104,.06);
  --caution:#8a6940;
  --caution-bg:#f8f3e9;
  --shadow:0 18px 54px rgba(20,24,22,.16);
  --max:980px;
  --reading:800px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Yu Mincho","Hiragino Mincho ProN",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.75}
body.modal-open{overflow:hidden}
a{color:inherit}
.page{max-width:var(--max);margin:0 auto;padding:52px 42px 80px}
.site-head{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
h1{font-family:var(--serif);font-size:clamp(2rem,5vw,3.4rem);font-weight:500;line-height:1.08;letter-spacing:-.02em;margin:0}
.subtitle{margin-top:10px;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:1.05rem}
.intro-card{max-width:var(--reading);margin:0 0 26px}
.intro-card p{margin:0 0 8px}
.disclaimer{font-size:.9rem;color:var(--muted);line-height:1.7}
.toolbar{max-width:var(--reading);display:flex;align-items:center;gap:12px;margin:0 0 8px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.search-wrap{flex:1}
#search{width:100%;border:0;background:transparent;padding:5px 0;font:inherit;color:var(--text);outline:none}
#search::placeholder{color:#9a9c95}
.visible-count{font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.paper-list{max-width:var(--reading)}
.paper{display:grid;grid-template-columns:42px minmax(0,1fr) 24px;gap:12px;align-items:start;padding:21px 4px 22px;border-bottom:1px solid var(--line);cursor:pointer;outline:none;transition:background .15s ease,padding .15s ease,margin .15s ease}
.paper:hover,.paper:focus-visible{background:var(--accent-soft);margin-left:-12px;margin-right:-12px;padding-left:16px;padding-right:16px}
.paper-num{font-family:var(--serif);font-size:.96rem;color:var(--accent);padding-top:3px;font-variant-numeric:tabular-nums}
.paper-title{font-family:var(--serif);font-weight:600;font-size:1.18rem;line-height:1.42;margin:0}
.paper-meta{margin-top:4px;color:var(--muted);font-size:.85rem}
.one-line{margin:9px 0 0;line-height:1.7;color:#363a34;font-size:.96rem}
.paper-open{color:var(--accent);font-family:var(--serif);font-size:1.2rem;line-height:1;padding-top:4px;text-align:right}
.hidden{display:none!important}
.footer-note{max-width:var(--reading);margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}

.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:28px}
.modal-backdrop{position:absolute;inset:0;background:rgba(31,33,30,.42);backdrop-filter:blur(2px)}
.modal-panel{position:relative;z-index:1;width:min(760px,100%);max-height:min(84vh,900px);overflow:auto;background:var(--paper);border:1px solid rgba(31,33,30,.12);box-shadow:var(--shadow);padding:34px 38px 30px}
.modal-close{position:absolute;top:14px;right:17px;border:0;background:transparent;color:var(--muted);font-family:var(--serif);font-size:1.7rem;line-height:1;cursor:pointer;padding:4px 8px}
.modal-close:hover{color:var(--text)}
.modal-number{font-family:var(--serif);color:var(--accent);font-size:.9rem;margin-bottom:6px}
.modal-title{font-family:var(--serif);font-size:clamp(1.35rem,3vw,1.8rem);font-weight:600;line-height:1.4;margin:0;padding-right:26px}
.modal-meta{color:var(--muted);font-size:.88rem;margin-top:7px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.detail-list{margin-top:6px}
.detail-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;padding:13px 0;border-bottom:1px solid #e7e8e2}
.detail-label{font-weight:650;font-size:.9rem;color:#42463f}
.detail-row.caution{margin-top:8px;padding:12px 12px;background:var(--caution-bg);border-bottom:0}
.detail-row.caution .detail-label{color:var(--caution)}
.modal-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px}
.original-link{color:var(--accent);font-weight:650;text-decoration:none;border-bottom:1px solid rgba(23,107,104,.3)}
.original-link:hover{border-color:var(--accent)}
.doi{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}

@media(max-width:700px){
  .page{padding:34px 20px 60px}
  .paper{grid-template-columns:30px minmax(0,1fr) 18px;gap:8px;padding:18px 0 19px}
  .paper:hover,.paper:focus-visible{margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px}
  .paper-title{font-size:1.08rem}
  .one-line{font-size:.93rem}
  .modal{padding:12px}
  .modal-panel{max-height:92vh;padding:28px 22px 24px}
  .detail-row{grid-template-columns:1fr;gap:4px;padding:11px 0}
  .modal-footer{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="page">
  <header class="site-head">
    <div class="eyebrow">Weekly Paper Digest</div>
    <h1>%%HEADER_TITLE%%</h1>
    <div class="subtitle">%%SUBTITLE%%</div>
  </header>

  %%INTRO%%

  <div class="toolbar">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="タイトル・Journal・内容から検索" aria-label="論文を検索">
    </div>
    <div class="visible-count" id="visibleCount"></div>
  </div>

  <main class="paper-list">
    %%PAPER_ITEMS%%
  </main>

  <p class="footer-note">Weekly Paper Digest — summaries are provided as a guide to the literature, not as a substitute for the original articles.</p>
</div>

%%MODALS%%
%%SCRIPT%%
</body>
</html>
